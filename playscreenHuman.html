<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/3x3.css" />
    <link rel="stylesheet" href="./css/18x18.css" />
    <link rel="stylesheet" href="./css/style.css">
    <!-- <link rel="stylesheet" href="./css/18x18.css"> -->
    <title>Tic Tac Toe</title>
  </head>

  <body>
    <h1 class="heading-content">Caro Game</h1>
    <div class="game-container">

      <div class="score">
        <div class="player">
            <div id="name-player-1"></div>
            <div id="score-player"></div>
        </div>
        <span>:</span>
        <div class="AI">
            <div id="name-player-2"></div>
            <div id="score-AI"></div>
        </div>
      </div>

      <div class="status">Lượt của <span id="player-turn"></span></div>
      <div class="map-3x3"></div>

      <div class="map-16x16 map-container"></div>

      <div class="button-game">
        <button id="reset-btn">Resart</button>
        <button id="return-home-btn">Home</button>
      </div>

    </div>

    <script src="./js/ruleHuman.js"></script>
    <script src="./js/public.js"></script>
  </body>
</html>
