<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />

    <link rel="stylesheet" href="./css/style.css" />
    <title>Caro Game</title>
  </head>

  <body>
    <h1 class="heading-wellcome">Caro Game</h1>
    <div class="home-control">
      <div id="userControl" class="mb-3">
        <div class="currentUser"></div>
        <button id="loginBtn" class="btn btn-success">Đăng nhập</button>
        <button id="logoutBtn" class="btn btn-danger d-none">Đăng xuất</button>
      </div>

      <div class="choose-status-game position" id="choose-status-game">
        <h2 class="heading-form-controll">Bắt đầu</h2>
        <div class="d-grid gap-2 col-6 mx-auto">
          <button class="btn btn-primary" id="newGame" type="button">
            Chơi mới
          </button>
          <button class="btn btn-primary" id="countinueGame" type="button">
            Chơi tiếp
          </button>
        </div>
      </div>

      <div id="rank-view">
        <button class="btn btn-primary rank-btn" id="rank" type="button">
          <i class="fa-solid fa-trophy"></i>
          Xếp Hạng
        </button>
      </div>

      <!-- setting game -->
      <div id="game-setting" class="mt-4 d-none">
        <h2>Cài đặt trò chơi</h2>
        <div class="mt-3">
          <h4>Chế độ chơi</h4>
          <div class="d-grid gap-2 col-6 mx-auto">
            <button
              class="btn btn-outline-primary active"
              id="play-with-AI"
              mode-game="playwAI"
            >
              Chơi với máy
            </button>
            <button
              class="btn btn-outline-primary"
              id="play-with-human"
              mode-game="playwhuman"
            >
              Chơi với người
            </button>
          </div>
        </div>

        <div class="mt-3">
          <h4>Chọn kích thước bàn cờ</h4>
          <select class="form-select w-50 mx-auto" id="sizeMap">
            <option value="3">3x3</option>
            <option value="16">16x16</option>
          </select>
        </div>

        <div class="mt-3">
          <h4>Chọn mức độ chơi</h4>
          <select class="form-select w-50 mx-auto" id="levelGame">
            <option value="easy">Tân thủ</option>
            <option value="normal">Có Kinh Nghiệm</option>
          </select>
        </div>

        <div class="mt-3 d-none" id="infoSecond">
          <div class="card shadow-lg p-3 w-50 mx-auto">
            <h4 class="text-center mb-3">Thông tin Người Chơi 2</h4>
            <div class="mb-3">
              <input
                id="username"
                type="text"
                class="form-control"
                placeholder="Nhập tên người chơi"
                required
              />
            </div>
            <div class="mb-3">
              <input
                id="pass"
                type="password"
                class="form-control"
                placeholder="Nhập mật khẩu"
                required
              />
            </div>
            <div class="messageError"></div>
          </div>
        </div>

        <div class="text-center mt-3"></div>
        <button id="startGame" class="btn btn-primary">Bắt đầu</button>
        <button id="backtoMenu" class="btn btn-secondary">Quay lại</button>
      </div>
    </div>
    <script src="./js/index.js"></script>
  </body>
</html>
