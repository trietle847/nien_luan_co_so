<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Caro Game</title>
  </head>

  <body class="bg-dark text-white">
    <div class="container d-flex justify-content-center align-items-center vh-100">
      <div class="card p-4 shadow-lg bg-light text-dark" style="width: 400px">
        <h2 class="text-center mb-4">Caro Game</h2>

        <!-- Tabs để chuyển đổi giữa Đăng nhập và Đăng ký -->
        <ul class="nav nav-pills mb-3 d-flex justify-content-center" id="pills-tab">
          <li class="nav-item">
            <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-form">
              Đăng Nhập
            </button>
          </li>
          <li class="nav-item">
            <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-form">
              Đăng Ký
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <!-- đăng nhập-->
          <div class="tab-pane fade show active" id="login-form">
            <form>
              <div class="mb-3">
                <label class="form-label">Tên người chơi</label>
                <input id="usernameLogin" type="text" class="form-control" placeholder="Nhập tên người chơi" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input id="passwordLogin" type="password" class="form-control" placeholder="Nhập mật khẩu" required />
              </div>
              <button id="login" type="submit" class="btn btn-primary w-100">Đăng Nhập</button>
            </form>
            <div id="messageError" class="text-center mt-3"></div>
          </div>

          <!-- đăng ký -->
          <div class="tab-pane fade" id="register-form">
            <form id="register-data">
              <div class="mb-3">
                <label class="form-label">Tên người chơi</label>
                <input id="usernameResgiter" type="text" class="form-control" placeholder="Nhập vào tên người chơi" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input id="passwordResgiter" type="password" class="form-control" placeholder="Nhập mật khẩu" required />
              </div>
              <button id="register" type="submit" class="btn btn-success w-100">Đăng Ký</button>
            </form>
            <div id="message" class="text-center mt-3"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./js/login.js"></script>
  </body>
</html>
