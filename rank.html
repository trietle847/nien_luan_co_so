<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/rank.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <title>Caro Game - Bảng Xếp Hạng</title>
  </head>

  <body>
    <div class="container mt-4">
      <!-- Tabs điều hướng -->
      <ul class="nav nav-tabs" id="leaderboardTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="win-rate-tab" data-bs-toggle="tab" data-bs-target="#winRateTab" type="button" role="tab">
            🏆 Tỷ Lệ Thắng
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="points-tab" data-bs-toggle="tab" data-bs-target="#pointsTab" type="button" role="tab">
            🏆 Điểm Số
          </button>
        </li>
      </ul>

      <div class="tab-content mt-3">
        <!-- Bảng Xếp Hạng Tỷ Lệ Thắng -->
        <div class="tab-pane fade show active" id="winRateTab" role="tabpanel">
          <h2 class="text-center">🏆 Bảng Xếp Hạng Tỷ Lệ Thắng 🏆</h2>
          <table class="table table-bordered table-striped text-center mt-3">
            <thead class="table-dark">
                <tr>
                    <th>Hạng</th>
                    <th>Tên Tài Khoản</th>
                    <th>Số Trận Đấu</th>
                    <th>Số Trận thắng</th>
                    <th>Tỷ Lệ Thắng (%)</th>
                </tr>
                <tbody id="winRateTable"></tbody>
            </thead>
          </table>
        </div>

        <!-- Bảng Xếp Hạng Điểm Số -->
        <div class="tab-pane fade" id="pointsTab" role="tabpanel">
          <h2 class="text-center">🏆 Bảng Xếp Hạng Điểm Số 🏆</h2>
          <table class="table table-bordered table-striped text-center mt-3">
            <thead class="table-dark">
                <tr>
                    <th>Hạng</th>
                    <th>Tên Tài Khoản</th>
                    <th>Số Trận Đấu</th>
                    <th>Điểm số</th>
                </tr>
                <tbody id="pointTable"></tbody>
            </thead>
          </table>
        </div>
      </div>

      <div class="action">
        <button id="backtoMenu" class="btn btn-secondary">Quay lại</button>
      </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            let users = JSON.parse(localStorage.getItem("users")) || [];

            function updateWinRateTable() {
                users.forEach(user => {
                user.winRate = user.countMatch > 0 ? ((user.matchWin / user.countMatch) * 100).toFixed(2) : 0;
                users.sort((a,b) => b.winRate - a.winRate);

                const winRateTable = document.getElementById("winRateTable");
                winRateTable.innerHTML = users.map((user, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${user.username}</td>
                    <td>${user.countMatch}</td>
                    <td>${user.matchWin}</td>
                    <td>${user.winRate}%</td>
                </tr>
                `).join("");
            })
            }

            function updatePointTable() {
                users.forEach(user => {
                users.sort((a,b) => b.point - a.point);

                const winPointTable = document.getElementById("pointTable");
                winPointTable.innerHTML = users.map((user, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td>${user.username}</td>
                    <td>${user.countMatch}</td>
                    <td>${user.point}</td>
                </tr>
                `).join("");
            })
            }
            updateWinRateTable()
            updatePointTable()
        })
        backtoMenu.addEventListener("click", () => {
            window.location.href = "index.html"
        });
    </script>
  </body>
</html>
